apiVersion: v1
kind: Pod
metadata: 
  name: my-first-pod
  namespace: work
  labels: 
    app: ngnix
    version: 1.27.5

spec:
  containers:
    - name: ngnix
      image: nginx:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10 #в access.log nginx а будет писаться строчка каждые 10 сек
