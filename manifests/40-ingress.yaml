apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferrum
  namespace: ferrum
spec:
  ingressClassName: traefik
  rules:
    - host: ferrum.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ferrum
                port:
                  name: http
