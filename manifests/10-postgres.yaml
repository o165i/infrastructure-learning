# База данных: один под Postgres с постоянным томом.
# StorageClass не указан -> берётся класс по умолчанию (local-path).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ferrum
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ferrum
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: ferrum
            - name: POSTGRES_DB
              value: ferrum
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferrum-secrets
                  key: POSTGRES_PASSWORD
            # данные в подпапке тома, иначе Postgres спотыкается о служебные файлы корня тома
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ferrum", "-d", "ferrum"]
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ferrum", "-d", "ferrum"]
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
