# ПРИМЕР формата. Настоящий секрет в Git не коммитим!
# Создаётся командой (значения генерируются на месте):
#   PGPASS=$(openssl rand -hex 16)
#   kubectl -n ferrum create secret generic ferrum-secrets \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=DATABASE_URL="postgresql://ferrum:${PGPASS}@postgres:5432/ferrum?schema=public" \
#     --from-literal=NEXTAUTH_SECRET="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: ferrum-secrets
  namespace: ferrum
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://ferrum:change-me@postgres:5432/ferrum?schema=public
  NEXTAUTH_SECRET: change-me
