---
# Присоединение нового воркера к существующему кластеру RKE2.
# Запуск (пароль sudo спросит сам, в файлах его хранить не надо):
#   ansible-playbook -i hosts.ini setup-rke2-worker.yml -K
# Нужна группа [new_workers] в hosts.ini с новой нодой.
- hosts: new_workers
  become: true
  vars:
    # ВАЖНО: версия агента не должна быть новее версии сервера (c1).
    # Без фиксации скрипт get.rke2.io ставит самую свежую версию.
    rke2_version: "v1.35.6+rke2r1"
    rke2_server_url: "https://192.168.56.105:9345"
  tasks:
    - name: Read join token from the control plane
      slurp:
        src: /var/lib/rancher/rke2/server/node-token
      delegate_to: c1
      register: node_token
      no_log: true

    - name: Install RKE2 agent (pinned version)
      shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE="agent" INSTALL_RKE2_VERSION="{{ rke2_version }}" sh -
      args:
        creates: /usr/local/bin/rke2

    - name: Create RKE2 config directory
      file:
        path: /etc/rancher/rke2
        state: directory
        mode: '0755'

    - name: Write agent config (server address and token)
      copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: '0600'
        content: |
          server: {{ rke2_server_url }}
          token: {{ node_token.content | b64decode | trim }}
      no_log: true

    - name: Enable and start RKE2 agent
      service:
        name: rke2-agent
        state: started
        enabled: yes
