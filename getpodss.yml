---
- hosts: c1
  become: false
  tasks:
    - name: Create .kube directory
      file:
        path: ~/.kube
        state: directory
        mode: '0755'

    - name: Copy kubeconfig
      become: true
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: /home/o165i/.kube/config
        owner: o165i
        group: o165i
        mode: '0600'
        remote_src: yes

    - name: Add KUBECONFIG to bashrc
      lineinfile:
        path: ~/.bashrc
        line: 'export KUBECONFIG=/etc/rancher/rke2/rke2.yaml'
        state: present
